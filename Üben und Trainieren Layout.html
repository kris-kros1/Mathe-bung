<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mathe-Übungsband Klasse 2</title>
<style>
:root {
  --bg:#f6f3ea; --paper:#fffdf8; --ink:#24282b; --muted:#6a7074;
  --yellow:#f1c94a; --blue:#dcebf5; --green:#dcefd9; --orange:#f5e2bf; --line:#ded9ce;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;background:var(--bg);color:var(--ink)}
body{overflow:hidden}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh}
.sidebar{background:#22272a;color:white;padding:18px 14px;overflow:auto}
.brand{padding:4px 8px 16px;font-weight:800;letter-spacing:.03em}
.brand small{display:block;color:#c9d0d3;font-weight:500;margin-top:4px}
.weekbtn{width:100%;border:0;background:transparent;color:#e8ecee;text-align:left;padding:10px 10px;border-radius:10px;cursor:pointer;font-size:14px}
.weekbtn:hover,.weekbtn.active{background:#3a4145}
.weekbtn span{opacity:.65;margin-right:6px}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:62px;display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.65);backdrop-filter:blur(8px)}
.title{font-weight:800;font-size:20px;flex:1}
.btn{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--yellow);border-color:var(--yellow)}
.content{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.card{width:min(1180px,96%);min-height:610px;background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 30px rgba(0,0,0,.06);padding:28px 32px;display:flex;flex-direction:column}
.kicker{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
h1{font-size:34px;margin:6px 0 8px;line-height:1.1}
.goal{font-size:19px;color:var(--muted);margin-bottom:18px}
.phasebar{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.phase{padding:8px 12px;border-radius:999px;background:#eee;color:#555;font-size:13px;font-weight:800}
.phase.active{background:var(--yellow);color:#222}
.panel{flex:1;display:flex;flex-direction:column}
.panel h2{font-size:26px;margin:0 0 12px}
.big{font-size:30px;line-height:1.45}
.tasks{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1}
.level{border:1px solid var(--line);border-radius:18px;padding:18px;background:white}
.level h3{margin:0 0 10px;font-size:18px}
.level ul,.steps{margin:0;padding-left:22px;font-size:20px;line-height:1.55}
.strategy{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;align-items:stretch}
.example{border-radius:18px;background:var(--blue);padding:22px;font-size:32px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center}
.say{border-radius:18px;background:white;border:1px solid var(--line);padding:22px;font-size:23px;display:flex;align-items:center}
.gamebox{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.timerbox{margin-top:18px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:#f3f1ea}
.time{font-variant-numeric:tabular-nums;font-weight:900;font-size:28px;min-width:90px}
.materials{font-size:15px;color:var(--muted);margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.teacher{margin-top:14px;border:1px dashed #bdb7a8;border-radius:14px;padding:12px 14px;background:#fffaf0;font-size:14px;color:#555}
.teacher summary{font-weight:800;cursor:pointer}

.qmstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.qmchip{border-radius:12px;padding:10px 12px;background:#f4f2eb;font-size:13px;line-height:1.35}
.qmchip b{display:block;margin-bottom:3px}
.thinkprompt{margin-top:12px;padding:13px 15px;border-left:5px solid var(--yellow);background:#fffaf0;border-radius:10px;font-size:16px}
.footerline{margin-top:16px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
.fullscreen .sidebar,.fullscreen .topbar{display:none}
.fullscreen .app{grid-template-columns:1fr}
.fullscreen .content{padding:0}
.fullscreen .card{width:100vw;height:100vh;min-height:100vh;border-radius:0;border:0;box-shadow:none;padding:40px 54px}
.fullscreen h1{font-size:44px}
.fullscreen .goal{font-size:23px}
.fullscreen .big{font-size:38px}
.fullscreen .level ul,.fullscreen .steps{font-size:27px}
.fullscreen .example{font-size:40px}
.navbottom{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
@media(max-width:900px){
 .app{grid-template-columns:1fr} .sidebar{display:none} .tasks,.strategy,.gamebox{grid-template-columns:1fr} body{overflow:auto} .main{min-height:100vh}
}

.numbered-tasks{
  display:grid;
  gap:10px;
  margin-top:6px;
}
.numbered-task{
  display:grid;
  grid-template-columns:46px minmax(0,1fr);
  align-items:start;
  column-gap:18px;
}
.task-no{
  width:38px;
  height:38px;
  border-radius:50%;
  background:var(--yellow);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  font-weight:900;
  line-height:1;
  margin-top:4px;
}
.task-content{
  min-width:0;
}
.fullscreen .numbered-task{
  grid-template-columns:58px minmax(0,1fr);
  column-gap:24px;
}
.fullscreen .task-no{
  width:46px;
  height:46px;
  font-size:19px;
}


.phase{display:flex;align-items:center;gap:8px}
.phaseicon{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#fff;font-size:22px;box-shadow:0 2px 5px rgba(0,0,0,.08)}
.heroicon{width:58px;height:58px;border-radius:18px;display:inline-flex;align-items:center;justify-content:center;background:#fff;font-size:38px;box-shadow:0 5px 0 rgba(0,0,0,.08);margin-right:10px;vertical-align:middle}

.qmchip{position:relative;padding-left:46px}
.comic-mini{position:absolute;left:10px;top:12px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;font-size:18px;box-shadow:0 2px 4px rgba(0,0,0,.08)}
.teacher{font-size:13.5px;line-height:1.3}
.materials{display:flex;gap:8px;align-items:flex-start}
.mat-icon{font-size:22px}
.fullscreen .heroicon{width:70px;height:70px;font-size:46px}
.fullscreen .phaseicon{width:42px;height:42px;font-size:27px}
.fullscreen 


.modebadge{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-weight:900;font-size:15px;margin:0 7px 10px 0}
.mode-alone{background:#e8f2ff}.mode-partner{background:#e8f5e6}.mode-talk{background:#fff0cf}.mode-free{background:#f0e8ff}
.blitzgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.blitzmain,.blitzplus{border-radius:18px;padding:18px;border:1px solid var(--line)}
.blitzmain{background:#f8fbff}.blitzplus{background:#fff8d9;border:2px dashed #e3c14e}.blitzplus h3,.blitzmain h3{margin:0 0 10px}
.sequence{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 14px}.seqstep{border-radius:14px;padding:12px;text-align:center;font-weight:800;background:#f3f1eb}.seqstep strong{display:block;font-size:22px}
.exchangebar{margin-top:14px;padding:12px 14px;border-radius:14px;background:#fff0cf;border:1px solid #ead39a;font-size:16px}
@media(max-width:900px){.blitzgrid,.sequence{grid-template-columns:1fr}}


/* Untere Meta-Hinweise wie Denken / Vernetzen / Darstellen / Begründen ausblenden */
.qmstrip, .qm-chip-row, .quamath-strip { display:none !important; }


/* ===== KINDGERECHTER FINALER FEINSCHLIFF ===== */
:root{
  --soft-shadow: 0 10px 24px rgba(70,60,40,.08);
  --soft-shadow-small: 0 4px 10px rgba(70,60,40,.07);
}
body{
  background:
    radial-gradient(circle at 15% 10%, rgba(245,217,107,.18), transparent 24%),
    radial-gradient(circle at 85% 85%, rgba(220,236,255,.22), transparent 26%),
    var(--bg);
}
.app{
  background:transparent;
}
.sidebar{
  background:rgba(255,253,248,.96);
  border-right:1px solid rgba(0,0,0,.06);
  box-shadow:6px 0 24px rgba(70,60,40,.05);
}
.sidebar h1{
  font-size:22px;
  line-height:1.08;
  margin-bottom:6px;
}
.sidebar .sub{
  line-height:1.35;
}
.weekbtn{
  border-radius:14px;
  padding:10px 12px;
  margin-bottom:6px;
  transition:.15s ease;
}
.weekbtn:hover{
  transform:translateX(2px);
  box-shadow:var(--soft-shadow-small);
}
.weekbtn.active{
  border:2px solid rgba(0,0,0,.08);
  box-shadow:var(--soft-shadow-small);
}
.topbar{
  background:rgba(245,241,231,.88);
  backdrop-filter: blur(8px);
  border-bottom:1px solid rgba(0,0,0,.05);
}
.topbar button{
  border-radius:14px;
  padding:10px 14px;
  font-size:14px;
}
.main{
  padding:22px 24px 34px;
}
.slide{
  max-width:1220px;
  margin:0 auto;
}
.titlebox{
  background:rgba(255,253,248,.98);
  border-radius:24px;
  padding:20px 22px;
  box-shadow:var(--soft-shadow);
  border:1px solid rgba(0,0,0,.05);
  margin-bottom:16px;
}
.titlebox h1,
.titlebox h2{
  letter-spacing:-.02em;
}
.phasebar{
  gap:8px;
  margin-bottom:14px;
  padding:8px;
  background:rgba(255,255,255,.55);
  border-radius:18px;
  border:1px solid rgba(0,0,0,.04);
}
.phase{
  border-radius:16px;
  padding:8px 11px;
  font-size:13px;
  font-weight:800;
  background:#f2efe8;
  transition:.15s ease;
}
.phase.active{
  box-shadow:0 4px 10px rgba(70,60,40,.08);
}
.phaseicon{
  width:36px;
  height:36px;
  font-size:23px;
}
.panel{
  border-radius:24px;
  padding:22px;
  background:rgba(255,253,248,.98);
  border:1px solid rgba(0,0,0,.05);
  box-shadow:var(--soft-shadow);
}
.panel h2{
  font-size:27px;
  line-height:1.15;
  margin-bottom:16px;
  letter-spacing:-.02em;
}
.heroicon{
  width:62px;
  height:62px;
  border-radius:20px;
  font-size:40px;
  box-shadow:0 5px 0 rgba(0,0,0,.07);
}
.modebadge{
  font-size:14px;
  letter-spacing:.02em;
  padding:8px 13px;
  border:1px solid rgba(0,0,0,.05);
  box-shadow:0 2px 5px rgba(0,0,0,.04);
}
.blitzgrid{
  gap:16px;
}
.blitzmain,.blitzplus{
  border-radius:20px;
  padding:18px 18px 16px;
  box-shadow:var(--soft-shadow-small);
}
.blitzmain h3,.blitzplus h3{
  font-size:19px;
  margin-bottom:12px;
}
.numbered-task{
  grid-template-columns:48px minmax(0,1fr);
  column-gap:14px;
  align-items:center;
  padding:5px 0;
}
.task-no{
  width:40px;
  height:40px;
  font-size:16px;
  box-shadow:0 3px 7px rgba(0,0,0,.06);
}
.task-content{
  font-size:clamp(20px,2.3vw,29px);
  line-height:1.25;
  font-weight:760;
  letter-spacing:.01em;
}
.sequence{
  gap:12px;
}
.seqstep{
  border-radius:18px;
  min-height:126px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:var(--soft-shadow-small);
}
.seqstep strong{
  font-size:27px;
}
.strategy{
  gap:16px;
}
.example,.say{
  border-radius:20px;
  box-shadow:var(--soft-shadow-small);
}
.example{
  font-size:clamp(30px,4vw,48px);
  font-weight:850;
}
.say{
  font-size:18px;
  line-height:1.45;
}
.tasks{
  gap:14px;
}
.level{
  border-radius:20px;
  padding:18px;
  box-shadow:var(--soft-shadow-small);
  border:1px solid rgba(0,0,0,.04);
}
.level h3{
  font-size:20px;
  margin-bottom:10px;
}
.level li{
  margin-bottom:10px;
  line-height:1.38;
}
.exchangebar{
  border-radius:18px;
  padding:14px 16px;
  line-height:1.4;
  box-shadow:var(--soft-shadow-small);
}
.gamebox{
  gap:14px;
}
.materials{
  margin-top:14px;
  padding:12px 14px;
  border-radius:16px;
  background:#f7f3e9;
  border-top:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);
}
.mat-icon{
  font-size:24px;
}
.teacher{
  border-radius:16px;
  background:#fffaf0;
  box-shadow:0 2px 8px rgba(0,0,0,.03);
}
.timerbox{
  border-radius:18px;
}
.navrow{
  margin-top:16px;
}
.navrow button{
  border-radius:16px;
  min-height:48px;
  font-size:15px;
  font-weight:850;
}
.footerline{
  opacity:.75;
}
/* sanfte visuelle Trennung der drei Übungsniveaus */
.tasks .level:nth-child(1){border-top:6px solid #a9cea2}
.tasks .level:nth-child(2){border-top:6px solid #a9c9e6}
.tasks .level:nth-child(3){border-top:6px solid #efc76e}
/* Exit besonders ruhig und fokussiert */
.panel .level[style*="var(--green)"]{
  box-shadow:none;
  border:2px solid rgba(0,0,0,.05);
}
/* größere Darstellung im Vollbild */
.fullscreen .panel{
  max-width:1320px;
  margin:0 auto;
  padding:28px;
}
.fullscreen .task-content{
  font-size:32px;
}
.fullscreen .level li,
.fullscreen .say{
  font-size:21px;
}
/* Tabletfreundlich */
@media(max-width:950px){
  .main{padding:16px}
  .panel{padding:18px}
  .titlebox{padding:17px}
  .tasks{grid-template-columns:1fr}
  .gamebox{grid-template-columns:1fr}
}
@media(max-width:720px){
  .phasebar{overflow-x:auto;justify-content:flex-start}
  .phase{flex:0 0 auto}
  .blitzgrid,.sequence{grid-template-columns:1fr}
  .task-content{font-size:22px}
}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">MATHE-ÜBUNGSBAND <small>Klasse 2 · 39 Wochen · 40 Minuten<br>verstehens- und kommunikationsorientiert</small></div>
    <div id="weeklist"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="title" id="topTitle">Mathe-Übungsband</div>
      <button class="btn" onclick="toggleTeacher()">Lehrerhinweise</button>
      <button class="btn" onclick="toggleFullscreen()">Vollbild</button>
      <button class="btn primary" onclick="nextPhase()">Weiter →</button>
    </div>
    <div class="content"><div class="card" id="card"></div></div>
  </main>
</div>
<script>

ce": {"basis": ["Bearbeite Aufgaben aus deinem persönlichen Übungsbereich."], "standard": ["Löse einen Jahresmix aus Plus, Minus, Mal, Geteilt."], "plus": ["Löse Transferaufgaben und erfinde eine Partner-Challenge."]}, "game": {"title": "Partner-Challenge", "steps": ["Erfinde drei gute Aufgaben.", "Partner löst und erklärt.", "Danach Rollen wechseln."]}, "exit": ["Rechne: 67 + 8 = __", "Rechne: 81 − 7 = __", "Nenne eine Strategie, die du sicher kannst."], "materials": ["persönliche Diagnosekarten", "Strategiekarten"], "blitz_plus": ["67+8", "81−7", "Welche Strategie nimmst du mit in Klasse 3?"]}];
let wi=0, pi=0, showTeacher=false, timer=null, remaining=0;
const phaseNames=["Start","Mathe-Blitz","Strategie","Übungszeit","Spiel","Exit"];
const mins=[0,5,7,18,7,3];

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function weekList(){
 const el=document.getElementById("weeklist"); el.innerHTML="";
 weeks.forEach((w,i)=>{
   const b=document.createElement("button"); b.className="weekbtn"+(i===wi?" active":"");
   b.innerHTML=`<span>${String(w.week).padStart(2,"0")}</span>${w.title}`;
   b.onclick=()=>{wi=i;pi=0;stopTimer();render();weekList();};
   el.appendChild(b);
 });
}

function numbered(items, className="big"){
  return `<div class="${className} numbered-tasks">${items.map((x,i)=>
    `<div class="numbered-task"><span class="task-no">${i+1}</span><span class="task-content">${esc(x)}</span></div>`
  ).join("")}</div>`;
}

const phaseIcons=["","⚡","🧠","✏️","🤝","✅"];
function phaseBar(){
 return `<div class="phasebar">${phaseNames.slice(1).map((n,i)=>`<div class="phase ${pi===i+1?'active':''}"><span class="phaseicon">${phaseIcons[i+1]}</span><span>${i+1} · ${n}</span></div>`).join("")}</div>`;
}
function timerHtml(){
 if(pi===0) return "";
 return `<div class="timerbox"><div class="time" id="time">${String(mins[pi]).padStart(2,"0")}:00</div>
 <button class="btn primary" onclick="startTimer()">Timer starten</button>
 <button class="btn" onclick="stopTimer(true)">Zurücksetzen</button>
 <span>Wenn die Zeit vorbei ist: direkt auf „Weiter“.</span></div>`;
}
function teacherHtml(w){
 if(!showTeacher) return "";
 let hint="";
 if(pi===1) hint="Beobachten: Wer rechnet sicher? Wer zählt? Wer braucht Material?";
 if(pi===2) hint="Ein Beispiel sichern – dann sofort die Kinder arbeiten lassen.";
 if(pi===3) hint="Jetzt bei den Kindern sein: Beobachte nicht nur richtig/falsch, sondern Denkwege. Wer zählt? Wer nutzt Beziehungen? Wer kann Darstellungen wechseln? Wer erklärt? Gib möglichst eine weiterführende Frage statt einer Lösung: „Was weißt du schon?“, „Kannst du es zeigen?“, „Welche Hilfsaufgabe passt?“.";
 if(pi===4) hint="Zuhören: Erklären die Kinder wirklich? Frage: „Was ist bei euren Wegen gleich?“";
 if(pi===5) hint="Exit lesen: Verständnis, Strategie oder Automatisierung? Nächsten Schritt ableiten.";
 return `<div class="teacher"><b>👩‍🏫 Kurz für die Lehrkraft:</b> ${hint}</div>`;
}
function qmHtml(w){
 let q=[];
 if(pi===1) q=[
  ['🧠 Denken','Suche Beziehungen zu Aufgaben, die du schon kennst.'],
  ['🔗 Vernetzen','Welche frühere Aufgabe hilft dir?'],
  ['💬 Sprechen','Vergleiche einen Rechenweg mit deinem Partner.'],
  ['🔎 Diagnose','Markiere, wo du noch zählen oder lange überlegen musst.']
 ];
 if(pi===2) q=[
  ['👀 Darstellen','Zeige den Weg mit Material, Bild, Rechenstrich oder Rechnung.'],
  ['🔗 Vernetzen','Verbinde die Darstellung mit Bekanntem.'],
  ['💬 Erklären','Nutze: „Ich weiß …, deshalb …“'],
  ['❓ Begründen','Warum funktioniert die Strategie?']
 ];
 if(pi===3) q=[
  ['🟢 Anknüpfen','Beginne dort, wo du sicher arbeiten kannst.'],
  ['🧠 Produktiv üben','Suche Muster, Beziehungen und Hilfsaufgaben.'],
  ['💬 Austausch','Erkläre mindestens einen Weg und vergleiche ihn.'],
  ['⭐ Weiterdenken','Begründe, vergleiche, finde Fehler oder erfinde Aufgaben.']
 ];
 if(pi===4) q=[
  ['💬 Kommunizieren','Ergebnis allein reicht nicht – erkläre deinen Weg.'],
  ['👂 Verstehen','Wiederhole den Weg deines Partners mit eigenen Worten.'],
  ['🔁 Vergleichen','Was ist gleich? Was ist anders?'],
  ['🧠 Aktiv denken','Fragt euch: „Warum?“ und „Woher weißt du das?“']
 ];
 if(pi===5) q=[
  ['🔎 Zeigen','Das Exit-Ticket zeigt deinen aktuellen Lernstand.'],
  ['🟢 Sicher','Ich kann es ohne Zählen und kann meinen Weg erklären.'],
  ['🟡 Fast','Ich kann es mit einer Hilfe oder Darstellung.'],
  ['🔴 Nächster Schritt','Ich brauche noch Material, Hilfsaufgabe oder Erklärung.']
 ];
 if(!q.length) return '';
 return `<div class="qmstrip">${q.map(x=>`<div class="qmchip"><span class="comic-mini">${x[0].split(" ")[0]}</span><b>${x[0]}</b>${x[1]}</div>`).join('')}</div>`;
}


function modeBadge(type){
 const m={alone:["👤","ALLEIN","mode-alone"],partner:["👥","PARTNER","mode-partner"],talk:["🔄","AUSTAUSCH","mode-talk"],free:["🎯","FREIE WAHL","mode-free"]}[type];
 return `<span class="modebadge ${m[2]}">${m[0]} ${m[1]}</span>`;
}
function bulbList(items){
 return `<div class="numbered-tasks">${items.map(x=>`<div class="numbered-task"><span class="task-no" style="background:#ffe36f">💡</span><span class="task-content">${esc(x)}</span></div>`).join("")}</div>`;
}

function render(){
 const w=weeks[wi]; document.getElementById("topTitle").textContent=`Woche ${w.week} · ${w.title}`;
 let body=`<div class="kicker">Woche ${w.week} · 40 Minuten</div><h1>${esc(w.title)}</h1><div class="goal">🎯 ${esc(w.goal)}</div>${phaseBar()}`;
 if(pi===0){
   body+=`<div class="panel"><h2><span class="heroicon">🚀</span>Heute trainieren wir</h2><div class="big">${esc(w.goal)}</div>
   <div class="gamebox" style="margin-top:24px">
     <div class="level" style="background:var(--yellow)"><h3>So läuft die Stunde</h3><ol class="steps"><li>5 Min Blitz</li><li>7 Min Strategie</li><li>18 Min Üben</li><li>7 Min Partner/Spiel</li><li>3 Min Exit</li></ol></div>
     <div class="level"><h3>Material liegt bereit</h3><ul class="steps">${w.materials.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
   </div></div>`;
 }
 if(pi===1){
   body+=`<div class="panel"><h2><span class="heroicon">⚡</span>Mathe-Blitz · 5 Minuten</h2>${modeBadge("alone")}
   <div class="blitzgrid">
    <div class="blitzmain"><h3>1–5 · zuerst</h3>${numbered(w.blitz)}</div>
    <div class="blitzplus"><h3>💡 Weiterdenken · erst danach</h3><div class="locknote">Nur wenn 1–5 fertig sind.</div>${bulbList(w.blitz_plus)}</div>
   </div></div>`;
 }
 if(pi===2){
   body+=`<div class="panel"><h2><span class="heroicon">🧠</span>Strategie · ${esc(w.strategy.name)}</h2>
   <div class="sequence">
    <div class="seqstep">${modeBadge("alone")}<strong>1</strong>selbst machen</div>
    <div class="seqstep">${modeBadge("partner")}<strong>2</strong>Weg zeigen</div>
    <div class="seqstep">${modeBadge("talk")}<strong>3</strong>genau besprechen</div>
   </div>
   <div class="strategy"><div class="example">${esc(w.strategy.example)}</div>
   <div class="say"><div><b>Genau besprechen:</b><br><br>„${esc(w.strategy.say)}“<br><br><b>Partnerfrage:</b> Warum funktioniert dieser Weg?</div></div></div>
   </div>`;
 }
 if(pi===3){
   body+=`<div class="panel"><h2><span class="heroicon">✏️</span>Übungszeit · 18 Minuten</h2>${modeBadge("free")}
   <div class="tasks">
    <div class="level" style="background:#eef7ec"><h3>🟢 BASIS</h3><ul>${w.practice.basis.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="level" style="background:#eef5fa"><h3>🔵 STANDARD</h3><ul>${w.practice.standard.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="level" style="background:#fff7e6"><h3>⭐ PLUS</h3><ul>${w.practice.plus.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
   </div>
   
   <div class="exchangebar">${modeBadge("talk")} <b>Wenn ihr beide fertig seid:</b> Sucht euch jeweils eine Aufgabe aus. Zeigt euch euren Rechenweg genau, erklärt warum er funktioniert, vergleicht eure Wege und stellt euch gegenseitig mindestens eine Frage.</div></div>`;
 }
 if(pi===4){
   body+=`<div class="panel"><h2><span class="heroicon">🤝</span>${esc(w.game.title)} · 7 Minuten</h2>${modeBadge("partner")}
   <div class="gamebox">
    <div class="level" style="background:var(--orange)"><h3>So geht's</h3><ol class="steps">${w.game.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>
    <div class="level"><h3>Partnerregel</h3><ul class="steps"><li>Nicht vorsagen.</li><li>Weg erklären.</li><li>Genau zuhören.</li><li>Nachfragen: „Warum?“</li></ul></div>
   </div>
   <div class="exchangebar">${modeBadge("talk")} <b>Wenn ihr fertig seid:</b> Tauscht euch aus: Was war heute wichtig? Wo hattet ihr unterschiedliche Wege? Welcher Weg war besonders geschickt?</div></div>`;
 }
 if(pi===5){
   body+=`<div class="panel"><h2><span class="heroicon">✅</span>Exit-Ticket · 3 Minuten</h2>${modeBadge("alone")}
   <div class="level" style="background:var(--green);padding:26px">${numbered(w.exit,"steps")}</div>
   </div>`;
 }
 body += qmHtml(w)+teacherHtml(w)+timerHtml()+`<div class="navbottom"><button class="btn" onclick="prevPhase()">← Zurück</button><button class="btn primary" onclick="nextPhase()">Weiter →</button></div>
 <div class="materials"><span class="mat-icon">🧰</span><span><b>Material:</b> ${w.materials.map(esc).join(" · ")}</span></div>
 <div class="footerline"><span>Mathe-Übungsband Klasse 2</span><span>mit KI erstellt</span></div>`;
 document.getElementById("card").innerHTML=body;
}
function nextPhase(){
 stopTimer();
 if(pi<5) pi++; else if(wi<weeks.length-1){wi++;pi=0;weekList();}
 render();
}
function prevPhase(){
 stopTimer();
 if(pi>0) pi--; else if(wi>0){wi--;pi=5;weekList();}
 render();
}
function toggleTeacher(){showTeacher=!showTeacher;render();}
function toggleFullscreen(){document.body.classList.toggle("fullscreen");}
function startTimer(){
 stopTimer(); remaining=mins[pi]*60;
 const tick=()=>{
   const m=Math.floor(remaining/60),s=remaining%60; const el=document.getElementById("time");
   if(el) el.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
   if(remaining<=0){clearInterval(timer);timer=null; if(el) el.textContent="FERTIG"; return;}
   remaining--;
 };
 tick(); timer=setInterval(tick,1000);
}
function stopTimer(reset=false){if(timer)clearInterval(timer);timer=null;if(reset&&pi>0){remaining=mins[pi]*60;render();}}
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();nextPhase();}
 if(e.key==="ArrowLeft"){e.preventDefault();prevPhase();}
 if(e.key==="f")toggleFullscreen();
});
weekList(); render();
</script>
</body>
</html>
